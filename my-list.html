<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My List — ITSUKI ANIMES</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

</head>


<body>

  <!-- BACKGROUND -->

  <div class="bg-glow glow-one"></div>

  <div class="bg-glow glow-two"></div>


  <!-- NAVBAR -->

  <header class="navbar">

    <div class="brand">

      <div class="brand-icon">
        I
      </div>


      <div class="brand-name">

        ITSUKI

        <span>
          ANIMES
        </span>

      </div>

    </div>


    <a
      href="index.html"
      class="back-btn"
    >
      ← Back Home
    </a>

  </header>


  <!-- MY LIST -->

  <main class="mylist-page">

    <div class="mylist-header">

      <p class="section-tag">
        YOUR COLLECTION
      </p>

      <h1>
        My <span>List</span> ❤️
      </h1>

      <p>
        All your favorite anime in one place.
      </p>

    </div>


    <div
      id="mylist-grid"
      class="mylist-grid"
    >

      <p class="details-loading">
        Loading your list...
      </p>

    </div>

  </main>


  <script src="my-list.js"></script>

</body>

</html>
